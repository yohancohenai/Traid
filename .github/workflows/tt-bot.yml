# TT Elite Quant Pro - always-on bot on GitHub's free servers (no laptop needed).
# Every 10 minutes: fetch official tt-series.com results, retrain when due, predict, and send Telegram picks for
# each pick on its own, about 35 minutes before its match. Nothing is ever bet automatically.
# The bot's memory (database + trained model) is saved in the Actions cache between runs.
name: TT bot

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # every 10 min (off the hour: GitHub delays :00 runs most)
  workflow_dispatch: {}
  push:                        # Claude can start a run by updating .github/kick-bot
    branches: [main]
    paths: [".github/kick-bot"]

concurrency:
  group: tt-bot
  cancel-in-progress: false    # never run two at once; a long first run just delays the next

permissions:
  contents: write              # publishes the encrypted dashboard to the gh-pages branch
  actions: write               # lets each run start the next one (see last step)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100       # the first run downloads the full history (~40 min) and trains
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ttq
          POSTGRES_PASSWORD: ttq
          POSTGRES_DB: ttq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ttq" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TTQ_DATABASE_URL: postgresql+psycopg://ttq:ttq@localhost:5432/ttq
      TTQ_ARTIFACTS_DIR: ${{ github.workspace }}/state/artifacts
      TTQ_ENABLE_DEMO: "false"
      TTQ_TELEGRAM_BOT_TOKEN: ${{ secrets.TTQ_TELEGRAM_BOT_TOKEN }}
      TTQ_TELEGRAM_CHAT_ID: ${{ secrets.TTQ_TELEGRAM_CHAT_ID }}
      TTQ_JWT_SECRET: not-used-in-bot-mode
      TTQ_DASH_PASSWORD: ${{ secrets.TTQ_DASH_PASSWORD }}
      ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}          # Hard Rock + market prices (credits capped in code)
      ODDSPAPI_DAILY_CAP: "8"          # one sweep = DraftKings board = 1 credit
      ODDSPAPI_SWEEP_MINUTES: "100000" # no blind sweeps: a sweep is taken only when matches start within 45 min
      ODDSPAPI_SWEEP_HARDROCK: "0"     # bulk Hard Rock TT coverage is patchy; Hard Rock is read per match instead
      ODDSPAPI_NO_HR_PICKS: "1"        # step 1: model + DraftKings pre-qualify a match (1 credit covers all matches)
      ODDSPAPI_VERIFY_HR: "1"          # step 2: ~25 min before start, read that match's live board incl. Hard Rock
      ODDSPAPI_VERIFY_LEAD_MINUTES: "25"  #         (1 credit); send only if Hard Rock's real price is mispriced
      ODDSPAPI_VERIFY_RESERVE: "1"     # sweeps always leave 1 credit for a Hard Rock check
      ODDSPAPI_NEED_GAP_MINUTES: "60"
      ODDSPAPI_MONTHLY_CAP: "240"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/tt-elite-quant-pro-6b6pj7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tt-elite-quant-pro/backend/pyproject.toml

      - name: Install
        working-directory: tt-elite-quant-pro/backend
        run: |
          sudo apt-get install -y --no-install-recommends libgomp1 tesseract-ocr >/dev/null
          pip install -q -e .

      - name: Restore bot memory
        uses: actions/cache/restore@v4
        with:
          path: state
          key: ttq-state-${{ github.run_id }}
          restore-keys: ttq-state-

      - name: Load database
        run: |
          mkdir -p state/artifacts
          if [ -f state/db.dump ]; then
            docker exec -i ${{ job.services.postgres.id }} pg_restore -U ttq -d ttq --no-owner < state/db.dump
            echo "restored saved database"
          else
            echo "first run: starting fresh (full history download)"
          fi

      - name: Bot cycle
        working-directory: tt-elite-quant-pro/backend
        run: |
          alembic upgrade head
          python -m ttq.cli cloud-run --window 35 --hold 8 | tail -c 6000

      # Private dashboard: data is encrypted with TTQ_DASH_PASSWORD before it is published (the repo is public).
      - name: Publish dashboard
        if: always() && env.TTQ_DASH_PASSWORD != ''
        working-directory: tt-elite-quant-pro/backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m ttq.cli dashboard --out "$GITHUB_WORKSPACE/site"
          cd "$GITHUB_WORKSPACE/site"
          git init -q && git checkout -q -b gh-pages && git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898309+github-actions[bot]@users.noreply.github.com" commit -qm "dashboard update"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages

      - name: Save database
        if: always()
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U ttq -Fc ttq > state/db.dump
          du -sh state state/db.dump state/artifacts

      - name: Save bot memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: ttq-state-${{ github.run_id }}

      # GitHub's timer can be slow or skip runs, so each run starts the next one itself. Runs never overlap
      # (concurrency group above); the timer stays as a backup that restarts the chain if it ever breaks.
      - name: Start next run
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # retry: one failed API call here would stop the whole chain until the backup timer fires
          for i in 1 2 3 4 5 6; do
            gh workflow run tt-bot.yml --ref main --repo ${{ github.repository }} && exit 0
            echo "start-next-run attempt $i failed; retrying"; sleep $((i * 15))
          done
          exit 1
