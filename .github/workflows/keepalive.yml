# Keeps the TT bot's timed runs switched on. GitHub pauses scheduled workflows in a repo with no commits for
# 60 days; this commits a one-line timestamp every Monday so that never happens.
name: Keep TT bot alive

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898309+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive: keep TT bot schedule active" || exit 0
          git push
