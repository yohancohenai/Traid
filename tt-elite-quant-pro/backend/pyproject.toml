[project]
name = "ttq"
version = "1.0.0"
description = "TT Elite Quant Pro - TT Elite Series research & bet-tracking platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "pydantic-settings>=2.3",
  "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.1", "redis>=5.0",
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.13", "scikit-learn>=1.5", "lightgbm>=4.3",
  "catboost>=1.2", "optuna>=3.6", "httpx>=0.27", "python-jose[cryptography]>=3.3",
  "bcrypt>=4.1", "apscheduler>=3.10", "joblib>=1.4", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["ttq*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
